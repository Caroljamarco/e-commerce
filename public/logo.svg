<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Delícias da Casa</title>
  <!-- Background circle (primary) -->
  <rect width="256" height="256" rx="32" fill="#32493a" />

  <!-- Central emblem: fork + spoon simplified using paths with accent and secondary colors -->
  <g transform="translate(56,48) scale(0.8)">
    <!-- spoon (accent) -->
    <path d="M86 16c8 0 18 8 18 18 0 10-10 22-18 30-8-8-18-20-18-30 0-10 10-18 18-18z" fill="#7e4b29" opacity="0.95" />
    <!-- fork prongs (secondary) -->
    <g transform="translate(16,0)">
      <rect x="0" y="0" width="8" height="44" rx="3" fill="#e9be5e" />
      <rect x="14" y="0" width="8" height="44" rx="3" fill="#e9be5e" />
      <rect x="28" y="0" width="8" height="44" rx="3" fill="#e9be5e" />
      <rect x="42" y="0" width="8" height="44" rx="3" fill="#e9be5e" />
      <rect x="0" y="40" width="50" height="10" rx="5" fill="#ffffff" opacity="0.06" />
    </g>
  </g>

  <!-- Small white text/mark for contrast (optional) -->
  <text x="128" y="220" font-family="Segoe UI, Roboto, Arial" font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.95">Delícias</text>
</svg>
